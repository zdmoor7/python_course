<!DOCTYPE html>
<html>
<head>
    <title>Ask Claude</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 60px auto; padding: 0 20px; }
        textarea { width: 100%; height: 100px; font-size: 16px; padding: 10px; box-sizing: border-box; }
        button { margin-top: 10px; padding: 10px 24px; font-size: 16px; cursor: pointer; }
        .response { margin-top: 30px; background: #f4f4f4; padding: 20px; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Ask Claude</h1>
    <form method="POST">
        <textarea name="prompt" placeholder="Enter your prompt...">{{ prompt or "" }}</textarea>
        <br>
        <button type="submit">Send</button>
    </form>

    {% if response %}
    <div class="response">{{ response }}</div>
    {% endif %}
</body>
</html>
